name: Aprovação dos posts

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos (o GitHub pode atrasar alguns minutos em horários de pico)
  workflow_dispatch:

permissions:
  contents: write # para guardar a fila e as imagens dos posts publicados

concurrency:
  group: robo-nosso-voto
  cancel-in-progress: false

jobs:
  aprovacao:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # publicar vários posts aprovados de uma vez leva tempo (cada carrossel, 1 a 2 minutos)
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Conferir se os segredos já foram cadastrados
        id: segredos
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Segredos ainda não cadastrados: nada a fazer por enquanto (veja o README)."
            echo "prontos=false" >> "$GITHUB_OUTPUT"
          else
            echo "prontos=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.segredos.outputs.prontos == 'true'
      - uses: actions/setup-python@v6
        if: steps.segredos.outputs.prontos == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        if: steps.segredos.outputs.prontos == 'true'
        run: pip install -r requirements.txt
      - name: Identidade do robô no Git
        if: steps.segredos.outputs.prontos == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ler os botões do Telegram e publicar o que foi aprovado
        if: steps.segredos.outputs.prontos == 'true'
        run: python -m nossovoto.aprovacao

      - name: Guardar a fila no repositório
        if: always() && steps.segredos.outputs.prontos == 'true'
        run: |
          bash .github/scripts/salvar_dados.sh "Aprovação: fila de posts atualizada"
      - name: Avisar no Telegram se algo falhou
        if: failure() && steps.segredos.outputs.prontos == 'true'
        run: |
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ A aprovação de posts falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
