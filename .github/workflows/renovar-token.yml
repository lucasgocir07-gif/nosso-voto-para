name: Renovar token do Instagram

# O token do Instagram vale 60 dias. Renovando toda semana, ele nunca vence.
# Para guardar o token novo nos segredos, precisa do segredo GH_PAT (veja o README).

on:
  schedule:
    - cron: "0 12 * * 1" # segundas-feiras, 09:00 em Belém
  workflow_dispatch:

concurrency:
  group: robo-nosso-voto
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Renovar o token (o novo vai para um arquivo temporário, nunca para a tela)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python -m nossovoto.instagram --renovar --saida "$RUNNER_TEMP/token_instagram"
      - name: Guardar o token novo nos segredos do repositório
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta o segredo GH_PAT: sem ele, o token novo não pode ser guardado."
            exit 1
          fi
          gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token_instagram"
      - name: Apagar o arquivo temporário
        if: always()
        run: rm -f "$RUNNER_TEMP/token_instagram"

      - name: Avisar no Telegram se algo falhou
        if: failure()
        run: |
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Não consegui renovar o token do Instagram. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
